services:
  - type: web
    name: atsboost-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # You set this manually in Render dashboard (never commits to git)
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel URL e.g. https://atsboost.vercel.app
